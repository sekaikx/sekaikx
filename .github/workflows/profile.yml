name: Profile

on:
  push:
    paths-ignore: ['readme/stats-*.svg']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draw the stats card
        run: node .github/profile/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit it if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme/stats-*.svg
          git diff --cached --quiet || { git commit -m "Refresh profile stats"; git push; }

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#b0175f&color_dots=#e3e8e2,#efc6d8,#de8db2,#c4447f,#8f1450
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff4f9a&color_dots=#161b22,#4a1d34,#7d2552,#c23a78,#ff4f9a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
